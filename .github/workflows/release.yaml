name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        required: true
        options:
          - bump-minor
          - bump-patch


jobs:
  validate-release-input:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate next version
        env:
          NEXT_VERSION: ${{ inputs.next-version }}
        run: |
          set -eu

          case "${NEXT_VERSION}" in
            bump-minor|bump-patch)
              ;;
            *)
              echo "::error title=Invalid next-version::Select bump-minor or bump-patch when dispatching the release workflow."
              exit 1
              ;;
          esac

  build:
    needs:
      - validate-release-input
    uses: ./.github/workflows/build.yaml
    secrets:
      dockerhub-auth-token: ${{ secrets.DOCKERHUB_RO_AUTH }}
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      mode: release

  release-to-github-and-bump:
    uses: gardener/cc-utils/.github/workflows/release.yaml@v1 # zizmor: ignore[unpinned-uses,ref-confusion] -- same-org reusable workflow; intentionally allowed for now, planned to pin to a version in the future
    needs:
      - build
    secrets:
      slack-token: ${{ secrets.SLACK_APP_TOKEN_GARDENER_CICD }}
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      slack-channel-id: C017DNNNENQ # #gardener-dashboard channel
